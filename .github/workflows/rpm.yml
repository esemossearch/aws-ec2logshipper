name: Build and publish RPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Verify tag version
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Build RPM packages
        env:
          CGO_ENABLED: "0"
        run: make rpm

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpm-packages-${{ github.ref_name }}
          path: |
            build/rpmbuild/RPMS/**/*.rpm
            build/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Publish RPM release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/rpmbuild/RPMS/**/*.rpm build/rpmbuild/SRPMS/*.rpm --clobber
